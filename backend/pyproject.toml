[project]
name = "geo-metrics-api"
version = "0.1.0"
description = "Upload KML or zipped Shapefiles and get accurate per-feature area and length measurements."
readme = "../README.md"
license = { text = "MIT" }
authors = [{ name = "Arnav Gandhi" }]
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "shapely>=2.0.4",
  "pyproj>=3.6",
  "pyshp>=2.3",
  "lxml>=5.2",
]

[dependency-groups]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "httpx>=0.27",
  "ruff>=0.5",
  "mypy>=1.10",
  "lxml-stubs>=0.5",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "RUF", "PL", "PT", "S"]
ignore = ["PLR0913", "PLR2004", "PLR0911", "PLR0912", "PLR0915", "PLR0917", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S314", "PLR2004", "S320"]
"scripts/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/", "tests/", "scripts/"]

[[tool.mypy.overrides]]
module = ["shapefile", "shapely.*", "pyproj.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
  "error::DeprecationWarning:app.*",
  "ignore:Using `httpx` with `starlette.testclient`",
]
