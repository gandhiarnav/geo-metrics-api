# Render Blueprint Specification
# Deploys the FastAPI Docker Web Service and Managed PostgreSQL on Render

databases:
  - name: geo-metrics-db
    databaseName: geometrics
    user: geometrics
    plan: free

services:
  - type: web
    name: geo-metrics-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: geo-metrics-db
          property: connectionString
      - key: GEO_ENVIRONMENT
        value: production
      - key: GEO_MAX_UPLOAD_BYTES
        value: "20971520"
